log_format json_combined escape=json
  '{'
    '"time_local":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_time":$request_time'
  '}';

map $http_user_agent $loggable {
    ~^kube-probe/ 0;
    default       1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust X-Real-IP only from the pod network (ingress-nginx).
    set_real_ip_from 10.2.0.0/16;
    real_ip_header   X-Real-IP;

    access_log /dev/stdout json_combined if=$loggable;

    # Regex locations beat the prefix "location /", so these deny blocks apply to everything.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* /(CLAUDE|AGENTS)\.md$ { return 404; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
